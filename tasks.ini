[project-run]
command="$(VIM_FILEPATH)"
command:make=make dev
command:c,cpp=bash -c 'if [ -f CMakeLists.txt ]; then ./build/$(basename $PWD); else "$(VIM_PATHNOEXT)"; fi'
command:go=go run .
command:python=python "$(VIM_FILENAME)"
command:javascript=node "$(VIM_FILENAME)"
command:sh=sh "$(VIM_FILENAME)"
command:lua=lua "$(VIM_FILENAME)"
command:perl=perl "$(VIM_FILENAME)"
command:ruby=ruby "$(VIM_FILENAME)"
output=terminal
cwd=$(VIM_ROOT)
save=2


[project-build]
command:make=make build
command:c,cpp=bash -c 'if [ -f CMakeLists.txt ]; then cmake -B build && cmake --build build; else gcc -O2 -Wall "$(VIM_FILEPATH)" -o "$(VIM_PATHNOEXT)" -lstdc++ -lm -msse3; fi'
command:go=go build -o "$(VIM_PATHNOEXT)" "$(VIM_FILEPATH)"
output=quickfix
cwd=$(VIM_ROOT)
save=2

[project-test]
command:make=make test
command:c,cpp=bash -c 'if [ -f CMakeLists.txt ]; then cmake --build build --target test; else echo "Nenhum test configurado"; fi'
cwd=$(VIM_ROOT)
save=2

[cmake-configure]
command=cmake -B build -DCMAKE_BUILD_TYPE=Debug
output=quickfix
cwd=$(VIM_ROOT)
save=2
